<!doctype html>
<meta charset="utf-8">
<style>
  :root {
    --navy: #061b2a;
    --mint: #77d5bf;
    --paper: #eaf7f0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 600px; }
  body {
    position: relative;
    background:
      radial-gradient(900px 700px at 66% 50%, #12455f 0%, rgba(18,69,95,0) 62%),
      linear-gradient(160deg, #072133 0%, var(--navy) 60%, #04121d 100%);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }

  .copy {
    position: absolute;
    left: 84px; top: 50%;
    transform: translateY(-50%);
    max-width: 560px;
    z-index: 6;
  }
  .mark { width: 118px; height: 118px; margin-bottom: 22px; }
  h1 { font-size: 52px; line-height: 1.06; color: var(--paper); letter-spacing: -1.1px; }
  h1 span { color: var(--mint); }
  p.lead { margin-top: 20px; font-size: 22px; line-height: 1.45; color: #9fbccd; max-width: 24em; }
  p.foot { margin-top: 22px; font-size: 18px; color: #64879c; letter-spacing: 0.3px; }

  /*
    No phone frame. The widgets are the product, and the frame only ever raised the question of
    what the wallpaper behind it was doing.
  */
  .stage {
    position: absolute;
    left: 700px; top: 0;
    width: 900px; height: 600px;
    perspective: 2400px;
  }
  .widget {
    position: absolute;
    border-radius: 30px;
    overflow: hidden;
    box-shadow:
      0 60px 90px -30px rgba(0, 0, 0, .85),
      0 10px 34px rgba(0, 0, 0, .5);
  }
  .widget img { display: block; width: 100%; height: auto; }
  .w-cards {
    width: 430px;
    left: 40px; top: 78px;
    transform: rotateX(4deg) rotateY(-13deg) rotateZ(-3deg);
    z-index: 3;
  }
  .w-list {
    width: 400px;
    left: 460px; top: 290px;
    transform: rotateX(4deg) rotateY(-13deg) rotateZ(-3deg);
    z-index: 2;
  }
</style>

  <h1>Notes Widget <span>for Markdown</span></h1>
  <p class="lead">Your Markdown notes on the home screen, and a chip that tells you when sync broke.</p>
