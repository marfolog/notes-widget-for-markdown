<!doctype html>
<meta charset="utf-8">
<style>
  :root {
    --navy: #061b2a;
    --mint: #77d5bf;
    --paper: #eaf7f0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 600px; }
  body {
    position: relative;
    background:
      radial-gradient(900px 700px at 66% 50%, #12455f 0%, rgba(18,69,95,0) 62%),
      linear-gradient(160deg, #072133 0%, var(--navy) 60%, #04121d 100%);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }

  .copy {
    position: absolute;
    left: 84px; top: 50%;
    transform: translateY(-50%);
    max-width: 560px;
    z-index: 6;
  }
  .mark { width: 118px; height: 118px; margin-bottom: 22px; }
  h1 { font-size: 52px; line-height: 1.06; color: var(--paper); letter-spacing: -1.1px; }
  h1 span { color: var(--mint); }
  p.lead { margin-top: 20px; font-size: 22px; line-height: 1.45; color: #9fbccd; max-width: 24em; }
  p.foot { margin-top: 22px; font-size: 18px; color: #64879c; letter-spacing: 0.3px; }

  .stage {
    position: absolute;
    left: 640px; top: 0;
    width: 960px; height: 600px;
    perspective: 2000px;
  }
  .phone {
    position: absolute;
    left: 300px; top: 40px;
    width: 350px; height: 758px;
    border-radius: 52px;
    background: linear-gradient(135deg, #3a4350 0%, #10141a 42%, #232a33 100%);
    padding: 10px;
    transform: rotateX(6deg) rotateY(-14deg) rotateZ(-4deg);
    box-shadow:
      0 80px 110px -35px rgba(0, 0, 0, .85),
      0 10px 40px rgba(0, 0, 0, .5);
    z-index: 2;
  }
  .phone::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: 52px;
    background: linear-gradient(105deg, rgba(255,255,255,0) 55%, rgba(255,255,255,.16) 82%, rgba(255,255,255,0) 100%);
    pointer-events: none;
  }
  .screen {
    width: 100%; height: 100%;
    border-radius: 44px;
    overflow: hidden;
    background: #000;
  }
    /* Crop past the status bar: the wallpaper has a cable in it that reads as a render glitch. */
  .screen img { width: 100%; height: calc(100% + 104px); margin-top: -104px; object-fit: cover; display: block; }

  /* Widget cards floating out of the phone. */
  .card {
    position: absolute;
    border-radius: 26px;
    overflow: hidden;
    box-shadow:
      0 50px 70px -25px rgba(0, 0, 0, .8),
      0 8px 28px rgba(0, 0, 0, .45);
    z-index: 3;
  }
  .card img { display: block; width: 100%; height: auto; }
  .card-list {
    width: 290px;
    left: 90px; top: 330px;
    transform: rotateX(5deg) rotateY(10deg) rotateZ(-5deg);
  }
  .card-card {
    width: 300px;
    left: 640px; top: 80px;
    transform: rotateX(4deg) rotateY(-12deg) rotateZ(4deg);
  }

  .floor {
    position: absolute;
    left: 260px; top: 545px;
    width: 620px; height: 100px;
    transform: rotateX(72deg);
    background: radial-gradient(closest-side, rgba(0,0,0,.7), rgba(0,0,0,0));
    filter: blur(20px);
    z-index: 1;
  }
</style>

  <h1>Notes Widget <span>for Markdown</span></h1>
  <p class="lead">Your Markdown notes on the home screen, and a chip that tells you when sync broke.</p>
