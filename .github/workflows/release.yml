name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew :app:testFossDebugUnitTest

      - name: Restore the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed APKs
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleFossRelease :app:assemblePlayRelease

      - name: Collect the artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cp app/build/outputs/apk/foss/release/app-foss-release.apk "out/notes-widget-$VERSION-foss.apk"
          cp app/build/outputs/apk/play/release/app-play-release.apk "out/notes-widget-$VERSION-play.apk"
          cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      # The foss APK is the one most people download, and its whole point is that it cannot
      # phone home. Fail the release rather than ship an APK that contradicts the README.
      - name: Verify the foss APK has no INTERNET permission
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          VERSION="${GITHUB_REF_NAME#v}"
          if "$AAPT" dump permissions "out/notes-widget-$VERSION-foss.apk" | grep -q "android.permission.INTERNET"; then
            echo "::error::The foss APK requests INTERNET. Not releasing it."
            exit 1
          fi

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.apk
            out/SHA256SUMS.txt
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
